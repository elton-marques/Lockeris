name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Testes de integração
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: armarios
          POSTGRES_PASSWORD: armarios
          POSTGRES_DB: armarios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armarios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://armarios:armarios@localhost:5432/armarios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: armarios
          POSTGRES_PASSWORD: armarios
          POSTGRES_DB: armarios_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armarios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://armarios:armarios@localhost:5432/armarios_e2e
      # vazio = usar o Chromium empacotado do Playwright (o runner não tem Chrome do sistema)
      E2E_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
